name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (ubuntu, full)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -count=1 ./...
      # -race needs the TSan runtime, which requires cgo for the test
      # binary only — the library itself stays pure Go (CGO_ENABLED=0 build).
      - run: go test -race ./fft ./internal/nditer ./random
        env:
          CGO_ENABLED: "1"

  cross-build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: go build ./...
      # Note: full test suites for random/cmath bit-exact parity are pinned to
      # glibc (ubuntu). macOS/Windows libm may differ by 1 ULP in rare tails;
      # run tests there once platform-specific reference streams exist.
      - run: go test -count=1 . ./linalg ./fft ./polynomial ./assert ./strings ./ma ./emath
